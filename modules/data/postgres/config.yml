# PostgreSQL access for an agent: the psql client plus a tool to run SQL.
# The connection URL (postgres://user:pass@host:5432/db) comes from
# TREFOIL_SECRET_POSTGRES_URL on the server and reaches the container as
# POSTGRES_URL.
secrets:
  postgres_url:
    required: true

layers:
  - title: "Install psql"
    description: "PostgreSQL client from Debian"
    script: |
      apt-get update
      apt-get install -y --no-install-recommends postgresql-client
      rm -rf /var/lib/apt/lists/*
      psql --version

tools:
  - name: Query
    description: "Runs SQL against the PostgreSQL database with psql and returns the output. Accepts several statements and psql meta-commands such as \\dt, \\d table or \\dn. Read-only unless write is true."
    input_schema:
      type: object
      properties:
        sql: { type: string, description: "SQL statements and/or psql meta-commands to run" }
        write: { type: boolean, description: "Allow writes (INSERT, UPDATE, DDL, ...); defaults to false, which runs in a read-only transaction" }
      required: [sql]
    command:
      language: python
      code:
        content: !include file://tools.py
        entry: Query

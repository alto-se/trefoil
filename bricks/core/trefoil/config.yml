name: "Trefoil core"

layers:
  - title: "Artifacts directory"
    description: "Files copied here are collected by the server when the run ends"
    script: mkdir -p /trefoil/artifacts

tools:
  - name: SaveArtifact
    description: "Saves a file or directory from the container as a run artifact, so the user can download it after the run. Returns the artifact's name."
    input_schema:
      type: object
      properties:
        path: { type: string, description: "Path of the file or directory to save, e.g. /workspace/out/page.pdf" }
        name: { type: string, description: "Artifact name, a relative path such as reports/page.pdf (default: the file's own name)" }
      required: [path]
    command:
      language: python
      code:
        content: !Ref file://tools.py
        entry: SaveArtifact

[project]
name = "trefoil-cli"
version = "0.9.0"
description = "CLI for the trefoil agent server"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.scripts]
trefoil = "package:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["package"]

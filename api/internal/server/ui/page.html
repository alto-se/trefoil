<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>trefoil</title>
<script src="https://unpkg.com/htmx.org@2.0.4"></script>
<style>
  :root {
    --bg: #fafaf9; --panel: #fff; --fg: #1c1917; --muted: #78716c; --line: #e7e5e4;
    --ok: #15803d; --bad: #b91c1c; --run: #b45309; --accent: #4338ca; --info: #2563eb;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0a09; --panel: #1c1917; --fg: #f5f5f4; --muted: #a8a29e; --line: #292524;
      --ok: #4ade80; --bad: #f87171; --run: #fbbf24; --accent: #a5b4fc; --info: #60a5fa;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, sans-serif; }
  body { display: grid; grid-template-columns: 200px minmax(0, 1fr); min-height: 100vh; }
  aside { position: sticky; top: 0; height: 100vh; padding: 16px 12px; border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; gap: 2px; }
  aside h1 { margin: 0 8px 14px; font-size: 18px; }
  aside a { display: block; padding: 6px 10px; border-radius: 6px; color: var(--fg); text-decoration: none; }
  aside a:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
  aside a[aria-current] { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); font-weight: 500; }
  aside small { margin: auto 8px 0; color: var(--muted); font-size: 11px; }
  main { display: flex; flex-direction: column; gap: 16px; padding: 16px 24px; min-width: 0; }
  main > div[hidden] { display: none; }
  main > div { display: flex; flex-direction: column; gap: 16px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  section h2 { margin: 0; padding: 10px 14px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); border-bottom: 1px solid var(--line); }
  section h2.with-action { display: flex; justify-content: space-between; align-items: baseline; }
  section h2.with-action a { font-size: 12px; text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--accent); }
  .brick { border-bottom: 1px solid var(--line); }
  .brick:last-child { border-bottom: 0; }
  .brick h3 { margin: 0; padding: 10px 14px; font-size: 14px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .brick h3 .muted { font-weight: 400; font-size: 12px; }
  .brick table { border-top: 1px solid var(--line); table-layout: fixed; }
  .brick th:nth-child(1) { width: 28%; }
  .brick th:nth-child(2) { width: 12%; }
  .brick td { overflow-wrap: anywhere; }
  .brick dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0; padding: 10px 14px; border-top: 1px solid var(--line); }
  .brick dt { color: var(--muted); }
  .brick dd { margin: 0; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-weight: 500; color: var(--muted); font-size: 12px; }
  tr:last-child td { border-bottom: 0; }
  tr.click { cursor: pointer; }
  tr.click:hover td { background: color-mix(in srgb, var(--accent) 6%, transparent); }
  code, .mono { font-family: var(--mono); font-size: 12px; }
  .muted { color: var(--muted); }
  .empty { padding: 14px; color: var(--muted); }
  .usage { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 12px; }
  .usage div { display: flex; align-items: center; gap: 8px; }
  .usage svg { width: 120px; height: 28px; overflow: visible; }
  .run-usage { white-space: nowrap; font-size: 12px; }
  .run-usage svg { width: 60px; height: 16px; overflow: visible; vertical-align: middle; margin-right: 6px; }
  .usage polyline, .run-usage polyline { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
  .error { padding: 14px; color: var(--bad); }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; border: 1px solid currentColor; }
  .succeeded, .built { color: var(--ok); }
  .failed { color: var(--bad); }
  .running, .queued { color: var(--run); }
  .notbuilt { color: var(--muted); }
  .saved { padding: 10px 14px; color: var(--ok); border-bottom: 1px solid var(--line); }
  #secrets form.actions input { max-width: 280px; }
  details.other { padding: 10px 14px; border-top: 1px solid var(--line); }
  details.other form { margin-top: 8px; }
  button { font: inherit; font-size: 12px; padding: 3px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--panel); padding: 5px 16px; }
  .actions { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .fields { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 10px 14px; align-items: start; margin-bottom: 12px; }
  .fields label { padding-top: 6px; font-weight: 500; }
  .fields small { display: block; margin-top: 2px; }
  .fields textarea, .fields input:not([type=checkbox]), .fields select { margin-bottom: 0; }
  .choices { display: flex; flex-wrap: wrap; gap: 4px 16px; }
  .choices label { display: inline-flex; align-items: center; gap: 6px; }
  .fields .choices input[type=checkbox] { margin-top: 0; }
  .fields input[type=checkbox] { margin-top: 9px; width: 16px; height: 16px; accent-color: var(--accent); }
  input:not([type=checkbox]), select { width: 100%; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); font: inherit; }
  input:focus, select:focus { outline: 2px solid color-mix(in srgb, var(--accent) 40%, transparent); border-color: var(--accent); }
  @media (max-width: 600px) { .fields { grid-template-columns: 1fr; gap: 4px; } .fields label { padding-top: 8px; } }
  textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); font: inherit; resize: vertical; margin-bottom: 8px; }
  textarea.mono { font: 12px/1.4 var(--mono); }
  textarea:focus { outline: 2px solid color-mix(in srgb, var(--accent) 40%, transparent); border-color: var(--accent); }
  .detail { padding: 14px; }
  .detail h3 { margin: 0 0 8px; font-size: 14px; }
  .detail dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0 0 12px; }
  .detail dt { color: var(--muted); }
  .detail dd { margin: 0; }
  .prompt h3 { margin: 0; padding: 10px 14px 6px; font-size: 12px; font-weight: 500; color: var(--muted); text-transform: uppercase; }
  .prompt pre { margin: 0 14px 14px; max-height: 600px; }
  a.agent { color: var(--fg); text-decoration: none; }
  a.agent:hover { color: var(--accent); text-decoration: underline; }
  .run { display: flex; flex-direction: column; gap: 16px; }
  .run-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .run-head a { text-decoration: none; }
  .run-head h2 { margin: 0; font-size: 18px; display: flex; align-items: center; gap: 8px; }
  .run > dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0; }
  .run > dl dt { color: var(--muted); }
  .run > dl dd { margin: 0; }
  .run-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  .run-side { display: flex; flex-direction: column; gap: 16px; }
  @media (max-width: 1100px) { .run-grid { grid-template-columns: minmax(0, 1fr); } }
  .budgets { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 14px; align-items: center; margin: 0; padding: 12px 14px; }
  .budgets dt { color: var(--muted); }
  .budgets dd { margin: 0; display: flex; align-items: center; gap: 10px; }
  .bar { flex: 1; height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .bar > span { display: block; height: 100%; }
  .bar.running > span { background: var(--info); }
  .bar.finished > span { background: var(--ok); }
  .bar.over > span { background: var(--bad); }
  pre.flush { margin: 0; border: 0; border-radius: 0; max-height: 600px; }
  .run-logs pre.logs { height: calc(100vh - 80px); min-height: 240px; max-height: none; }
  .timeline { list-style: none; margin: 0; padding: 12px 14px; }
  .ev { position: relative; display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 10px; padding-bottom: 14px; }
  .ev:last-child { padding-bottom: 0; }
  .ev::before { content: ""; position: absolute; left: 7px; top: 14px; bottom: 0; width: 2px; background: var(--line); }
  .ev:last-child::before { display: none; }
  .ev .dot { width: 12px; height: 12px; margin: 3px 2px 0; border-radius: 50%; border: 2px solid var(--muted); background: var(--panel); position: relative; }
  .ev-tool .dot { border-color: var(--accent); }
  .ev-model .dot { border-radius: 3px; }
  .ev.succeeded .dot { border-color: var(--ok); background: var(--ok); }
  .ev.failed .dot { border-color: var(--bad); background: var(--bad); }
  .ev.running .dot { border-color: var(--run); animation: pulse 1.2s ease-in-out infinite; }
  .ev.pending .dot { border-style: dashed; }
  @keyframes pulse { 50% { background: var(--run); } }
  .ev-main { min-width: 0; color: var(--fg); }
  .ev-line { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .ev-at { margin-left: auto; }
  .ev-summary { color: var(--muted); overflow-wrap: anywhere; }
  .ev details { margin-top: 4px; }
  .ev summary { cursor: pointer; font-size: 12px; }
  .ev details pre { margin: 6px 0 0; max-height: 300px; }
  pre { margin: 0 0 12px; padding: 10px; max-height: 420px; overflow: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; font: 12px/1.4 var(--mono); white-space: pre-wrap; word-break: break-word; }
  @media (max-width: 800px) {
    body { grid-template-columns: 1fr; }
    aside { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 10px 16px; border-right: 0; border-bottom: 1px solid var(--line); }
    aside h1 { margin: 0 12px 0 0; }
    aside small { display: none; }
    main { padding: 16px; }
    table { display: block; overflow-x: auto; }
  }
</style>
</head>
<body>
<aside>
  <h1>trefoil</h1>
  <a href="#agents">Agents</a>
  <a href="#runs">Runs</a>
  <a href="#params">Params</a>
  <a href="#secrets">Secrets</a>
  <a href="#bricks">Bricks</a>
  <small>refreshes every 3s · jobs and sessions are in memory</small>
</aside>
<main>
  <!-- Hidden views stop polling: offsetParent is null inside display:none. -->
  <div data-view="agents">
    <section>
      <h2>Agents</h2>
      <div id="agents" hx-get="/ui/agents" hx-trigger="load, every 3s [this.offsetParent !== null], refresh from:body"></div>
    </section>
    <section>
      <h2>Build jobs</h2>
      <div id="jobs" hx-get="/ui/jobs" hx-trigger="load, every 3s [this.offsetParent !== null], refresh from:body"></div>
    </section>
    <section>
      <h2>Details</h2>
      <div id="detail"><div class="empty">Click an agent for its prompts and tools, Run to start it, or a build job to see its logs.</div></div>
    </section>
  </div>
  <div data-view="runs" hidden>
    <section>
      <h2>Runs</h2>
      <div id="sessions" hx-get="/ui/sessions" hx-trigger="load, every 3s [this.offsetParent !== null], refresh from:body"></div>
    </section>
  </div>
  <div data-view="agent" hidden>
    <div id="agent-page"></div>
  </div>
  <div data-view="run" hidden>
    <div id="run-page"></div>
  </div>
  <div data-view="params" hidden>
    <section>
      <h2>Params</h2>
      <div id="params" hx-get="/ui/params" hx-trigger="load"></div>
    </section>
  </div>
  <div data-view="secrets" hidden>
    <section>
      <h2>Secrets</h2>
      <div id="secrets" hx-get="/ui/secrets" hx-trigger="load"></div>
    </section>
  </div>
  <div data-view="bricks" hidden>
    <section>
      <h2>Bricks and tools</h2>
      <div id="bricks" hx-get="/ui/bricks" hx-trigger="load, refresh from:body"></div>
    </section>
  </div>
</main>
<script>
  // The URL hash picks the view so reloads and links keep it. #runs/<id>
  // is one run's own page and #agents/<name> one agent's.
  function show(e) {
    const views = document.querySelectorAll('[data-view]');
    let name = location.hash.slice(1);
    const run = name.match(/^runs\/([\w-]+)$/);
    if (run) {
      name = 'run';
      htmx.ajax('GET', '/ui/sessions/' + run[1], { target: '#run-page', swap: 'innerHTML' });
    }
    const agent = name.match(/^agents\/([\w.-]+)$/);
    if (agent) {
      name = 'agent';
      htmx.ajax('GET', '/ui/agents/' + encodeURIComponent(agent[1]), { target: '#agent-page', swap: 'innerHTML' });
    }
    const pick = [...views].some(v => v.dataset.view === name) ? name : 'agents';
    views.forEach(v => { v.hidden = v.dataset.view !== pick; });
    const nav = { run: 'runs', agent: 'agents' }[pick] || pick;
    document.querySelectorAll('aside a').forEach(a => {
      if (a.getAttribute('href') === '#' + nav) a.setAttribute('aria-current', 'page');
      else a.removeAttribute('aria-current');
    });
    // Catch up on whatever changed while the view was hidden.
    if (e) htmx.trigger(document.body, 'refresh');
  }
  addEventListener('hashchange', show);

  // Polling re-renders a running run; keep open details open and the logs
  // pinned to the bottom if they were.
  let kept = null;
  document.body.addEventListener('htmx:beforeSwap', e => {
    if (!e.detail.target.classList.contains('run')) return;
    const logs = e.detail.target.querySelector('pre.logs');
    kept = {
      open: [...e.detail.target.querySelectorAll('details[open]')].map(d => d.id),
      bottom: logs && logs.scrollHeight - logs.scrollTop - logs.clientHeight < 8,
    };
  });
  document.body.addEventListener('htmx:afterSettle', () => {
    if (!kept) return;
    const run = document.querySelector('#run-page .run');
    kept.open.forEach(id => { const d = run && run.querySelector('#' + CSS.escape(id)); if (d) d.open = true; });
    const logs = run && run.querySelector('pre.logs');
    if (logs && kept.bottom) logs.scrollTop = logs.scrollHeight;
    kept = null;
  });
  show();
</script>
</body>
</html>

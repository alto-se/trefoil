{
  "agents": [
    {
      "name": "echo",
      "input": [
        {
          "statement": "string"
        }
      ],
      "prompts": [
        {
          "source": "You are an echo agent. Reply with the user's message exactly as written, character for character. Add nothing before or after it: no greeting, no quotes, no commentary.\n",
          "role": "system"
        }
      ]
    }
  ],
  "defaults": {
    "provider": "bedrock",
    "aws_region": "us-east-1",
    "model": "claude-opus-5-5",
    "max_tokens": 4000,
    "limits": {
      "max_turns": 1,
      "timeout_seconds": 60,
      "max_cost_usd": 0.1
    }
  }
}

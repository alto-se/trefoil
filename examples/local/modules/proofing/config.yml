name: "Proofing"

# A layer runs at build time: here it installs an English word list for the
# SpellCheck tool.
layers:
  - title: "Install word list"
    description: "American English dictionary at /usr/share/dict/words"
    script: |
      apt-get update
      apt-get install -y --no-install-recommends wamerican
      rm -rf /var/lib/apt/lists/*

tools:
  - name: TextStats
    description: "Counts words, sentences and characters in a text and estimates reading time"
    input_schema:
      type: object
      properties:
        text: { type: string, description: "Text to measure" }
      required: [text]
    command:
      language: python
      code:
        content: !include file://tools.py
        entry: TextStats

  - name: SpellCheck
    description: "Lists words in a text that aren't in the system dictionary, with how often each appears"
    input_schema:
      type: object
      properties:
        text: { type: string, description: "Text to check" }
      required: [text]
    command:
      language: python
      code:
        content: !include file://tools.py
        entry: SpellCheck

# A skill zip holds the skill folder; the CLI packages it into the config as
# base64 and the server unpacks it at build time. To edit it:
# cd skills && unzip proofread.zip && ... && zip -rX proofread.zip proofread
skills:
  - source: !include file://skills/proofread.zip

# Everything here is local to this config: modules without a "<namespace>:"
# prefix are defined under `modules:` instead of loaded from the shared
# modules/ folder. Local and shared modules mix freely in an agent's list.
#
# The config is split over several files with `!include file://...`: any value
# can live in its own .yml (agents, a module, defaults), and `trefoil config
# package` inlines them into one bundle. Refs in a referenced file resolve
# against that file's folder.
agents:
  - !include file://agents/proofreader.yml

modules:
  # A module in its own file, laid out just like a shared module: a layer,
  # tools in tools.py and a skill zip.
  proofing: !include file://modules/proofing/config.yml

  # A module written inline, tool code and all.
  clock:
    tools:
      - name: Now
        description: "Returns the current UTC date and time in ISO 8601"
        input_schema: { type: object, properties: {} }
        command:
          language: python
          code: |
            from datetime import datetime, timezone

            def Now(args):
                return datetime.now(timezone.utc).isoformat(timespec="seconds")

defaults: !include file://defaults.yml

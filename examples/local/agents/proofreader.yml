# One agent per file. Refs resolve against this file's folder, so the prompt
# sits next to it.
name: proofreader
modules:
  - core:os    # shared: Read, Write, Bash
  - proofing   # local, in its own folder (modules/proofing/)
  - clock      # local, defined inline in config.yml
input_schema:
  type: object
  properties:
    text: { type: string, description: "Text to proofread" }
    filename: { type: string, default: "report.md" }
  required: [text]
prompts:
  - source: !include file://proofreader.md
    role: system

agents:
  - name: aws
    bricks:
      - cloud:aws
    input_schema:
      type: object
      properties:
        question: { type: string, description: "Question about your AWS account or AWS services" }
      required: [question]
    prompts:
      - source: !Ref file://prompt.md
        role: system

defaults:
  provider: bedrock
  aws_region: eu-west-1
  model: "claude-sonnet-4-6"
  max_tokens: 4000
  limits:
    max_turns: 15
    timeout_seconds: 300
    max_cost_usd: 0.50

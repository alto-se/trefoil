agents:
  - name: caveman
    modules:
      - style:caveman
    prompts:
      - source: !include file://prompt.md
        role: system

defaults:
  provider: bedrock
  aws_region: eu-west-1
  model: "claude-sonnet-4-6"
  max_tokens: 4000
  limits:
    max_turns: 3
    timeout_seconds: 60
    max_cost_usd: 0.10

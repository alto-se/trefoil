agents:
  - name: writer
    bricks:
      - core:os
    input_schema:
      type: object
      properties:
        topic: { type: string }
        filename: { type: string }
      required: [topic, filename]
    prompts:
      - source: !Ref file://prompt.md
        role: system

defaults:
  provider: bedrock
  aws_region: eu-west-1
  model: "claude-sonnet-4-6"
  max_tokens: 4000
  limits:
    max_turns: 5
    timeout_seconds: 120
    max_cost_usd: 0.20

agents:
  - name: release-notes
    bricks:
      - core:os
      - docs:release-notes
    input_schema:
      type: object
      properties:
        product: { type: string }
        version: { type: string }
        changes: { type: array, items: { type: string } }
        filename: { type: string }
      required: [product, version, changes, filename]
    prompts:
      - source: !Ref file://prompt.md
        role: system

defaults:
  provider: bedrock
  aws_region: eu-west-1
  model: "claude-sonnet-4-6"
  max_tokens: 4000
  limits:
    max_turns: 6
    timeout_seconds: 120
    max_cost_usd: 0.20

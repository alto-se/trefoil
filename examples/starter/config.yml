# The `trefoil init` starter: one agent that explains a codebase.
#
# Give it a public git repository; it clones it, reads the code and saves an
# onboarding guide (ONBOARDING.md) you download after the run. Try it with
# ./run.sh, or step by step:
#
#   trefoil config sync
#   trefoil agents build --agent=repo-guide
#   trefoil agents run --agent=repo-guide --input=file://input.json
#   trefoil sessions artifacts --agent=repo-guide SESSION_ID
#
# To make your own agent, copy the entry below, change its inputs and write a
# new prompt. Most of an agent is its prompt.

agents:
  - name: repo-guide
    # What the agent can do. Shared modules come with the engine; `git` is
    # defined further down in this file.
    modules:
      - core:os        # Read, Write and Bash tools
      - core:trefoil   # SaveArtifact: files you download after the run
      - git
    # The run's input. The dashboard turns this into a form.
    input_schema:
      type: object
      properties:
        repo:
          type: string
          description: "Public git URL, e.g. https://github.com/pallets/click"
        question:
          type: string
          description: "Optional: something to focus on, e.g. 'how are options parsed?'"
      required: [repo]
    prompts:
      - source: !include file://prompt.md
        role: system
    # Hard stops, so a run can't loop or spend forever.
    limits:
      max_turns: 30
      timeout_seconds: 600
      max_cost_usd: 1.00

# Local modules: capabilities this config adds itself. This one only installs
# git into the agent's image when it's built.
modules:
  git:
    layers:
      - title: "Install git"
        script: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
          rm -rf /var/lib/apt/lists/*

# Model settings every agent uses unless it sets its own.
defaults:
  provider: bedrock
  aws_region: eu-west-1
  model: "claude-sonnet-4-6"
  max_tokens: 8000

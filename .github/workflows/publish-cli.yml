# Publishes the trefoil CLI (cli/) to PyPI as trefoil-cli on every push to main.
#
# Version: MAJOR.MINOR from the VERSION file, PATCH = this workflow's run number,
# so every push gets a new, increasing version. Bump VERSION for a new minor/major.
#
# Uses PyPI trusted publishing (no API token): add a publisher for project
# "trefoil-cli", repo alto-se/trefoil, workflow publish-cli.yml, environment pypi.
name: publish-cli

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-cli
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - id: version
        name: Compute version
        run: |
          base=$(tr -d '[:space:]' < VERSION)
          version="$(echo "$base" | cut -d. -f1-2).${GITHUB_RUN_NUMBER}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          sed -i "s/^version = .*/version = \"$version\"/" cli/pyproject.toml
          grep '^version' cli/pyproject.toml

      - name: Build
        working-directory: cli
        run: uv build --out-dir ../dist

      - name: Smoke test
        run: |
          uv venv /tmp/venv
          uv pip install --python /tmp/venv dist/*.whl
          /tmp/venv/bin/trefoil --help > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/trefoil-cli/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

      - name: Tag release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/cli-v${{ needs.build.outputs.version }}" \
            -f sha="${GITHUB_SHA}"

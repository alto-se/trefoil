# Releases and publishes the trefoil CLI (cli/) to PyPI as trefoil-cli.
#
# Version: semantic-release reads conventional commits since the last cli-v* tag
# (fix: -> patch, feat: -> minor, feat!: / BREAKING CHANGE -> major), writes the
# new version to VERSION and cli/pyproject.toml, commits it back to main, tags
# cli-v<version> and creates a GitHub release. Config lives in .releaserc.json.
# Pushes with no releasable commits (chore:, docs:, ...) publish nothing.
#
# Uses PyPI trusted publishing (no API token): add a publisher for project
# "trefoil-cli", repo alto-se/trefoil, workflow publish-cli.yml, environment pypi.
name: publish-cli

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-cli
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      published: ${{ steps.semrel.outputs.new_release_published }}
      version: ${{ steps.semrel.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: semrel
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/exec
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cli-v${{ needs.release.outputs.version }}

      - uses: astral-sh/setup-uv@v6

      - name: Check version
        run: grep -x 'version = "${{ needs.release.outputs.version }}"' cli/pyproject.toml

      - name: Build
        working-directory: cli
        run: uv build --out-dir ../dist

      - name: Smoke test
        run: |
          uv venv /tmp/venv
          uv pip install --python /tmp/venv dist/*.whl
          /tmp/venv/bin/trefoil --help > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: [release, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/trefoil-cli/${{ needs.release.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

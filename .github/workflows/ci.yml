# Checks pull requests: tests and builds the API image (without pushing) and
# builds and smoke-tests the CLI. Publishing happens in release.yml.
name: ci

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Test
        working-directory: api
        run: go test ./...

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Build
        working-directory: cli
        run: uv build --out-dir ../dist

      - name: Smoke test
        run: |
          uv venv /tmp/venv
          uv pip install --python /tmp/venv dist/*.whl
          /tmp/venv/bin/trefoil --version

# Builds the API server image (Dockerfile) and publishes it to the GitHub
# Container Registry as ghcr.io/<owner>/trefoil-api.
#
# Pull requests only build the image. Pushes to main publish it tagged
# `latest` and `sha-<short sha>`.
name: publish-api

on:
  push:
    branches: [main]
    paths: [api/**, bricks/**, Dockerfile, .dockerignore, .github/workflows/publish-api.yml]
  pull_request:
    paths: [api/**, bricks/**, Dockerfile, .dockerignore, .github/workflows/publish-api.yml]
  workflow_dispatch:

concurrency:
  group: publish-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Test
        working-directory: api
        run: go test ./...

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/trefoil-api
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
